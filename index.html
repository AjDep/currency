<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yuan → LKR</title>
<style>
:root{--bg:#f3f1ec;--fg:#1d2a26;--mut:#6b7872;--card:#fff;--line:#d9d6cd;--acc:#b3261e;--ok:#14663f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--fg:#e8efec;--mut:#8fa09a;--card:#1b2420;--line:#2c3833;--acc:#ef7b72;--ok:#6fd3a0}}
:root[data-theme="dark"]{--bg:#121816;--fg:#e8efec;--mut:#8fa09a;--card:#1b2420;--line:#2c3833;--acc:#ef7b72;--ok:#6fd3a0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:420px;padding:20px 18px 32px}
h1{font-size:1.1rem;font-weight:600;margin:4px 0 18px;color:var(--mut)}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:6px}
.amt{display:flex;align-items:baseline;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.amt span{font-size:1.4rem;color:var(--acc);font-weight:600}
#cny{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:2.4rem;font-weight:600;outline:none}
.amt:focus-within{border-color:var(--acc)}
.res{margin:22px 0 6px}
.big{font-size:2.8rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;word-break:break-all}
.big small{font-size:1.1rem;color:var(--mut);font-weight:500;margin-left:4px}
.step{margin:10px 0 0;color:var(--mut);font-size:.95rem;font-variant-numeric:tabular-nums}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.rates input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit;font-size:1.1rem}
.rates input:focus{outline:2px solid var(--acc);outline-offset:1px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.quick button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 14px;font:inherit;font-size:.95rem}
.quick button:active{background:var(--line)}
@media (prefers-reduced-motion:no-preference){.big{transition:opacity .15s}}
</style>
</head>
<body>
<main>
<h1>Yuan → USD → LKR</h1>

<label for="cny">Amount in yuan</label>
<div class="amt"><span>¥</span><input id="cny" type="number" inputmode="decimal" value="50" step="any" min="0"></div>

<div class="quick" id="quick"></div>

<div class="res">
  <div class="big"><span id="lkr">0</span><small>LKR</small></div>
  <p class="step" id="step"></p>
</div>

<div class="rates">
  <div><label for="r1">Yuan per 1 USD</label><input id="r1" type="number" inputmode="decimal" step="any" value="6.67"></div>
  <div><label for="r2">LKR per 1 USD</label><input id="r2" type="number" inputmode="decimal" step="any" value="344"></div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const cny=$('cny'),r1=$('r1'),r2=$('r2');
const fmt=(n,d=2)=>n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});

try{
  const s=JSON.parse(localStorage.getItem('cny-lkr')||'null');
  if(s){r1.value=s.r1;r2.value=s.r2;if(s.amt)cny.value=s.amt}
}catch(e){}

function calc(){
  const a=parseFloat(cny.value)||0, x=parseFloat(r1.value), y=parseFloat(r2.value);
  if(!(x>0)||!(y>0)){$('lkr').textContent='–';$('step').textContent='Enter both rates above.';return}
  const usd=a/x, lkr=usd*y;
  $('lkr').textContent=fmt(lkr);
  $('step').textContent=`${fmt(a,a%1?2:0)} ¥ ÷ ${x} = $${fmt(usd,4)}  ×  ${y} = Rs ${fmt(lkr)}`;
  try{localStorage.setItem('cny-lkr',JSON.stringify({r1:r1.value,r2:r2.value,amt:cny.value}))}catch(e){}
}

[10,50,100,500,1000].forEach(v=>{
  const b=document.createElement('button');b.textContent='¥'+v;
  b.onclick=()=>{cny.value=v;calc()};$('quick').appendChild(b);
});
[cny,r1,r2].forEach(el=>el.addEventListener('input',calc));
calc();
</script>
</body>
</html>
